<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="1220" y2="0">
      <stop offset="0" stop-color="#FF9500" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#FF9500" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#FF2D55"/>
      <stop offset="0.75" stop-color="#AF52DE"/>
      <stop offset="1" stop-color="#0A84FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2328" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.3" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1280" height="320" fill="url(#gridFade)"/>
    </mask>
    <clipPath id="markClip">
      <rect x="96" y="112" width="96" height="96" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1280" height="320" fill="#ffffff"/>
  <rect width="1280" height="320" fill="url(#grid)" mask="url(#gridMask)"/>

  <!-- Monotonic (non-decreasing) step function -->
  <path d="M600 272H700V252H770V238H830V204H900V192H960V156H1020V126H1080V102H1140V68H1220"
        fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="900" cy="192" r="3.5" fill="#FF2D55"/>
  <circle cx="1020" cy="126" r="3.5" fill="#AF52DE"/>
  <circle cx="1140" cy="68" r="3.5" fill="#5E7BF0"/>
  <circle cx="1220" cy="68" r="6" fill="#0A84FF"/>

  <!-- Mark -->
  <g clip-path="url(#markClip)">
    <g transform="translate(96 112) scale(0.1875)">
  <defs>
    <linearGradient id="markBg" x1="0" y1="1" x2="1" y2="0"><stop offset="0.0" stop-color="#FF9500"/><stop offset="0.35" stop-color="#FF2D55"/><stop offset="0.68" stop-color="#AF52DE"/><stop offset="1.0" stop-color="#0A84FF"/></linearGradient>
    <radialGradient id="markGlow" cx="0.25" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#markBg)"/>
  <rect width="512" height="512" fill="url(#markGlow)"/>
  <g transform="translate(256 256) scale(0.8462) translate(-272.0 -236.0)">
    <path d="M104 372V220L170 306L236 220V372" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M276 160H380M328 160V312" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="440" cy="100" r="27.0" fill="#ffffff"/>
  </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="224" y="182" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" letter-spacing="-1.5" fill="#1f2328">
    <tspan font-weight="700">Monotonic</tspan><tspan font-weight="300" fill="#59636e" dx="18">Labs</tspan>
  </text>
</svg>
